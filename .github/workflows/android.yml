name: Android TV build

on:
  push:
    paths: ['app/**', 'android/**', 'package.json', '.github/workflows/android.yml']
  pull_request:
    paths: ['app/**', 'android/**', 'package.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the shared interface
        run: npm run check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Optional: your own signing key, so each new build installs over the last one and keeps
      # your Home settings. See android/README.md. Without it, GitHub signs with a throwaway key.
      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.CLEANFRAME_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p .local/android
            echo "$KEYSTORE" | base64 -d > .local/android/cleanframe.jks
          else
            echo "::warning::No CLEANFRAME_KEYSTORE_BASE64 secret; this APK will not install over a differently signed copy."
          fi
      - name: Build APK
        working-directory: android
        env:
          CLEANFRAME_KEYSTORE_PASSWORD: ${{ secrets.CLEANFRAME_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/CleanFrame-AndroidTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CleanFrame-AndroidTV
          path: android/app/build/outputs/apk/release/CleanFrame-AndroidTV.apk
          if-no-files-found: error
