name: Android TV build

on:
  push:
    branches: ['**']
    # Pushing a tag such as android-v0.6.1-1 builds and publishes that version (opt-in, like the box below).
    tags: ['android-v*']
    paths: ['app/**', 'android/**', 'package.json', '.github/workflows/android.yml']
  pull_request:
    paths: ['app/**', 'android/**', 'package.json', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the APK as a GitHub release, so the Mi Box can download it by web address'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Only used by the opt-in release step below.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the shared interface
        run: npm run check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Optional: your own signing key, so each new build installs over the last one and keeps
      # your Home settings. See android/README.md. Without it, GitHub signs with a throwaway key.
      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.CLEANFRAME_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p .local/android
            echo "$KEYSTORE" | base64 -d > .local/android/cleanframe.jks
          else
            echo "::warning::No CLEANFRAME_KEYSTORE_BASE64 secret; this APK will not install over a differently signed copy."
          fi
      - name: Build APK
        working-directory: android
        env:
          CLEANFRAME_KEYSTORE_PASSWORD: ${{ secrets.CLEANFRAME_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/CleanFrame-AndroidTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CleanFrame-AndroidTV
          path: android/app/build/outputs/apk/release/CleanFrame-AndroidTV.apk
          if-no-files-found: error
      # Opt-in only (publishing is a separate decision, see AGENTS.md). The latest APK is then at
      # https://github.com/<owner>/<repo>/releases/latest/download/CleanFrame-AndroidTV.apk
      - name: Publish release
        if: (github.event_name == 'workflow_dispatch' && inputs.publish) || startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="android-v$version-$GITHUB_RUN_NUMBER"
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; fi
          gh release create "$tag" \
            android/app/build/outputs/apk/release/CleanFrame-AndroidTV.apk \
            --title "CleanFrame for Android TV $version (build $GITHUB_RUN_NUMBER)" \
            --notes "Untested Android TV build of CleanFrame. Install guide: android/README.md. Third-party asset terms: THIRD_PARTY_NOTICES.md." \
            --target "$GITHUB_SHA" --latest
